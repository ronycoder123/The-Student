<!DOCTYPE html>
<html lang="en">
<head>
    <link class="favicon" id="favicon" rel="icon" type="image/png" href="">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title"></title>
</head>
<style>
    body{
        background-image: url('https://w.wallhaven.cc/full/01/wallhaven-012pr3.jpg');
            background-repeat: no-repeat;
            background-size:cover;
           background-attachment: fixed;
            background-position: center;
    }
    .cont{
            display: flex;
            gap:10px;
            height: fit-content;
        }
        .title_text{
            backdrop-filter: blur(10px);
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color:rgb(165, 85, 32);
            display: inline-block;
            font-size: 160%;
            padding:5px;
            border:2px solid rgb(255, 255, 255);
            border-radius: 20px;;
            width:fit-content;
        }
        .parent{
            display: flex;
            gap:10px;
            justify-content: space-between;
            width:100%;
        }
         .btn{
            transition-duration: 0.2s;
            backdrop-filter: blur(10px);
            border:2px solid rgb(165, 85, 32);
            background:transparent;
            border-radius:10px;
            color:white;
            font-family: 'Courier New', Courier, monospace;
            padding:20px;
            font-size:medium;
            position:relative;
        }
         .btn_holder{
            display: flex;
            align-items: center;
        }
         .text_reg{
           color:rgb(230, 216, 216);
            font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            text-align: center;

        }
        .pfp{
            border:2px solid rgb(165, 85, 32);
            border-radius: 10px;
            width: fit-content;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .pfp_settings{
            display:block;
            padding:10px
            
        } 
        .pfp_url{
            border:2px solid rgb(165, 85, 32);
            padding:10px;
            background: transparent;
            backdrop-filter:blur(10px);
            width:60vh;
            border-radius:10px;
            color:white
        }
        .pfp_cont{
            display: block;
            margin-right: auto;
            margin-left:auto;
            width:fit-content;
            gap:10px;
            padding:10px;
            border:2px solid rgb(165, 85, 32);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .pfp_url::placeholder{
            color:white
        }
        .info_holder{
            display: block;
            padding:10px;
        }
</style>
<body>
    <div class="parent">
        <div class="cont">
        <h1 class="title_text"><b style="color:rgb(16, 97, 219)">.The </b>Student</h1>
        </div>
        <div class="btn_holder" id="return">
        <button class="btn" >Return To Menu</button>
        </div>
        </div>
        <div class="pfp_cont">
            <h2 class="text_reg">Profile Settings</h2>
            <img class="pfp" alt="" id="pfp_id">
            <br>
            <div class="info_holder">
            <input id="url_inp" type="url" placeholder="Enter Your New pfp Url Here" class="pfp_url">
          <!--  <button class="btn" id="pfp_sub">Submit</button> -->
            <br>
            <br>
            <input id="user_inp" type="url" maxlength="10" placeholder="Enter Your New Username" class="pfp_url">
            </div>
               <button class="btn" id="pfp_sub" style="display: block;margin-left: auto;margin-right: auto;">Submit</button> 
        </div>
    <script>
        let id_num = localStorage.getItem('id_number')
        let favicon = document.getElementById('favicon')
        let favicon_picture = localStorage.getItem('pfp'+id_num)
        let account_name = localStorage.getItem('User'+id_num)
        let title = document.getElementById('title')
        let pfp_url_inp = document.getElementById('url_inp')
         let user_inp = document.getElementById('user_inp')
        let pfp = document.getElementById('pfp_id')
        let submit = document.getElementById('pfp_sub')
        let count=Number(localStorage.getItem('count'))
        //let duplicate_detected=false;
        //________________________________________________________________
        favicon.href=favicon_picture
        pfp.src=favicon_picture
        title.textContent=account_name + " | Modify Account"
        pfp_url_inp.value=favicon_picture
        user_inp.value = account_name;
        //___________________________________________________________
        document.getElementById('return').onclick=function(){
            console.log('1')
            window.location.href='main student interface.html'
        }
        //_____________________________________________________________
        submit.onclick=function(){
            let duplicate_detected=false;
            //update pfp
            favicon_picture=pfp_url_inp.value;
            pfp.src=pfp_url_inp.value
            favicon.href=favicon_picture
            localStorage.setItem('pfp'+id_num,pfp_url_inp.value)
        //______________________________________________________________________________
        //_______________________________________________________________________________
        let iterator=0;
        console.log('iterator value: ',+String(iterator))
           while (iterator < count){
            console.log(iterator)
            console.log(localStorage.getItem('User'+String(iterator)))
            if (user_inp.value.trim() === localStorage.getItem('User'+String(iterator))){
                console.log('Yes ITS A MATCH')
                user_inp.style.borderColor='red'
                duplicate_detected=true;
                
            }
           iterator++
           if(iterator>=count){
                if (duplicate_detected==false){
             account_name = user_inp.value;
             title.textContent=account_name + " | Modify Account"
            localStorage.setItem('User'+id_num,user_inp.value)
             user_inp.style.borderColor='green'
                }
        }
        }
            //_________________________________________________________________
        }
    </script>
</body>
</html>
