<html>
    <title>.Student</title>
    <style>
        body{
            background-image:url('https://w.wallhaven.cc/full/5d/wallhaven-5d6gj9.jpg');
            background-repeat: no-repeat;
            background-size:cover;
        }
        .title_text{
            backdrop-filter: blur(10px);
            font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color:rgb(165, 85, 32);
            display: inline-block;
            font-size: 160%;
            padding:5px;
            border:2px solid rgb(255, 255, 255);
            border-radius: 20px;;
            width:fit-content;
        }
        .center_tagline{
            text-align: center;
            display: block;
            text-align: center;
            color:white;
         font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
        }
        .account_log{
            overflow-x: auto;
            position: relative;
            height:70vh;   
            backdrop-filter:blur(10px);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            margin:0 auto;
            width:fit-content;
            min-width: 50vh;
            max-width:100%;
            border:2px solid #f5500f;
            border-radius: 20px;;
        }
        .btn{
  background: transparent;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  position: absolute;
  text-align: center;
  color:white;
  border-color: white;
  border-bottom-color: rgb(255, 255, 255);
  border-bottom-left-radius: 0px;
  border-bottom-right-radius: 0px;
  padding:10px;
  border-top-right-radius: 10px;
  border-top-left-radius: 10px;
  width:50%;
  bottom:0;
  margin-top:-10vh;
  transition-duration: 0.2s;
        }
  .btn:hover{
    border-bottom-left-radius: 10px;
    border-bottom-right-radius: 10px;
    transform: translateY(-10px);
  }
        .ask{
            text-align: center;
            display: block;
            text-align: center;
            color:white;
         font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
         position: fixed;
  top:0;
  color:#f5500f;
  border: 2px solid rgb(32, 32, 32);
  width: auto;
  padding:5px;
  border-radius:10px;
        }
        .guest{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            border:2px solid white;
            width:15vh;
            text-align: center;
            display: block;
            margin-right:auto;
            margin-left:auto;
            height:15vh;;
            border-radius: 100%;
            background-repeat: no-repeat;
            background-position: center;
            background-size:cover;
        }
        .acct{
            cursor:grab;
        }
        .mains{
            display: block;
            margin: 5px;;
            gap:10px;
            border:2px solid rgb(165, 85, 32);
            padding:15px;
            border-radius:20px;
            position: relative;
        }
        .splash{
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color:#ffffff;
            font-size:25px;
        }
    </style>
    <body>
        <div class="cont">
        <h1 class="title_text"><b style="color:rgb(16, 97, 219)">.The </b>Student</h1>
        </div>
        <h3 class="center_tagline">Empowering student learning through: <b style="color:rgb(202, 117, 6);;width: fit-content;border-radius:10px;backdrop-filter: blur(5px);">"experiences and logs"</b></h3>
         <div class="account_log" id="account_log">
            <h3 class="ask">Choose An Account</h3>
         <!--   <div class="mains" id ='mains'>
            <div class="guest">
            </div> 
            <h4 class="splash">Click Below To</h4> 
            </div>  -->



          <button class="btn" id="btn">Create Account</button>
         </div>
         <script>
            let step =0;
            //let count = Number(localStorage.getItem('count'))
            let count = localStorage.getItem('count')
            // Generating the main foundation for the user-card
            
            while (step<count){
                value = 'User'+String(step)
                console.log(step)
            let newBody=document.createElement('div')
            newBody.className='mains'
            newBody.addEventListener('click',function (){
                console.log(this.id)
                localStorage.setItem('id_number',(this.id))
                window.location.href='main student interface.html'              //YESYEYSESYEYSYES!!!! WE CAN NOW FINALLY LOCATE THE ID OF EACH CARD. WERE SAVED
            })
            newBody.id=step
            document.getElementById('account_log').appendChild(newBody)
            //__________________________________________
            // now generating the PFP:
            let newProfile = document.createElement('div')
            newProfile.className='guest'

             newProfile.style.backgroundImage=  "url('" + (localStorage.getItem('pfp'+step)) + "')";
            newBody.appendChild(newProfile) // yes..You can DO THAT
            //_____________________________________________
            // now loading in the splash text
            let splash = document.createElement('h4')
            splash.className='splash'
            splash.textContent= localStorage.getItem(value)
            newBody.appendChild(splash)
            step++;
            }
            document.getElementById('btn').onclick= function(){
                window.location.href='Polished Form.html'
            }
         </script>
    </body>
</html>
